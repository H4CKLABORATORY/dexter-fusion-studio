name: LOTTO LAB - historial oficial y sitio para iPhone
on:
  push:
    branches: [main]
    paths:
      - 'lotto-lab/**'
      - '.github/workflows/lotto-lab-pages.yml'
  schedule:
    - cron: '27 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lotto-lab-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar parsing y matematica
        run: |
          python -m unittest discover -s lotto-lab/tests -p 'test_data.py' -v
          node --check lotto-lab/assets/generator-pro.js
          node --test lotto-lab/tests/test_*.mjs
      - name: Descargar biblioteca completa desde NY Open Data
        run: python lotto-lab/scripts/build_data.py lotto-lab/data
      - name: Comprobar que ambos archivos existen
        run: |
          test -s lotto-lab/data/powerball.json
          test -s lotto-lab/data/megamillions.json
          python - <<'PY'
          import json
          for game in ('powerball', 'megamillions'):
              with open(f'lotto-lab/data/{game}.json',encoding='utf-8') as f:
                  obj=json.load(f)
              assert obj['count'] >= 1000
              print(game,obj['count'],obj['first_draw'],obj['last_draw'])
          PY
      - name: Archivo web descargable, incluso sin GitHub Pages
        uses: actions/upload-artifact@v4
        with:
          name: LOTTO-LAB-DEXTER-Historial-Completo
          path: lotto-lab/
          if-no-files-found: error
          retention-days: 30
      - name: Mantener LOTTO LAB en la ruta /lotto-lab/
        run: |
          mkdir -p _pages/lotto-lab
          cp -a lotto-lab/. _pages/lotto-lab/
          test -s _pages/lotto-lab/index.html
          test -s _pages/lotto-lab/data/powerball.json
          test -s _pages/lotto-lab/data/megamillions.json
      - name: Preparar sitio Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar web publicada, Powerball y Mega Millions
        shell: bash
        run: |
          set -euo pipefail
          base="https://h4cklaboratory.github.io/dexter-fusion-studio/lotto-lab"
          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 20 "$base/" -o /tmp/lotto.html \
              && grep -qi 'LOTTO LAB' /tmp/lotto.html \
              && grep -q 'assets/generator-pro.js' /tmp/lotto.html \
              && grep -q 'id="generador"' /tmp/lotto.html \
              && curl -fsSL --max-time 20 "$base/assets/generator-pro.js" -o /tmp/lotto-generator.js \
              && curl -fsSL --max-time 20 "$base/assets/lottery-pro.css" -o /tmp/lotto-style.css \
              && node --check /tmp/lotto-generator.js \
              && test -s /tmp/lotto-style.css \
              && curl -fsSL --max-time 20 "$base/data/powerball.json" -o /tmp/powerball.json \
              && curl -fsSL --max-time 20 "$base/data/megamillions.json" -o /tmp/megamillions.json \
              && python -c 'import json; assert all(json.load(open(f"/tmp/{name}.json"))["count"] >= 1000 for name in ("powerball", "megamillions"))'; then
              echo "OK: sitio y ambos históricos públicos disponibles"
              exit 0
            fi
            echo "Esperando propagación de Pages: intento $attempt/18"
            sleep 10
          done
          echo "::error::Pages no sirve HTML e históricos correctos en /lotto-lab/"
          exit 1
