name: Studio Qt — Windows EXE portable
on:
  pull_request:
    paths:
      - 'fusion/**'
      - 'studio.py'
      - 'studio-requirements.txt'
      - '.github/workflows/studio-windows.yml'
  push:
    branches: [main]
    paths:
      - 'fusion/**'
      - 'studio.py'
      - '.github/workflows/studio-windows.yml'
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Qt y empaquetador
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r studio-requirements.txt pyinstaller
      - name: Descargar FFmpeg y FFprobe con licencia
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg-windows.zip
          Expand-Archive -Path ffmpeg-windows.zip -DestinationPath ffmpeg-package
          $ffmpeg = Get-ChildItem -Path ffmpeg-package -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path ffmpeg-package -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'Missing FFmpeg binaries in distribution' }
          New-Item -ItemType Directory -Force ffmpeg-bin | Out-Null
          Copy-Item $ffmpeg.FullName ffmpeg-bin\ffmpeg.exe
          Copy-Item $ffprobe.FullName ffmpeg-bin\ffprobe.exe
          $licenses = Get-ChildItem -Path ffmpeg-package -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|COPYING)' }
          foreach ($license in $licenses) { Copy-Item $license.FullName "ffmpeg-bin\$($license.Name)" -Force }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $PWD 'ffmpeg-bin')
      - name: Probar modelo, render y GUI en Windows
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q fusion studio.py
          python -m unittest tests.test_tokenlab_workspace tests.test_tokenlab_tools tests.test_tokenlab_qt tests.test_studio_model tests.test_studio_qt tests.test_composition_layers -v
      - name: Crear ejecutable Qt
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name DexterFusionStudio --collect-submodules fusion studio.py
          Copy-Item ffmpeg-bin\* dist\DexterFusionStudio\ -Recurse -Force
          Copy-Item README.md dist\DexterFusionStudio\README_PROYECTO.md
          "Dexter Fusion Studio contiene componentes Qt/PySide6 (LGPLv3) y FFmpeg de terceros; consulte sus condiciones de distribución. No modifique ni quite sus avisos de copyright y licencia." | Out-File dist\DexterFusionStudio\AVISOS_LICENCIAS.txt -Encoding utf8
          if (-not (Test-Path dist\DexterFusionStudio\DexterFusionStudio.exe)) { throw 'Missing packaged executable' }
          if (-not (Test-Path dist\DexterFusionStudio\ffmpeg.exe)) { throw 'Missing bundled ffmpeg.exe' }
      - name: Ejecutar EXE empaquetado y verificar captura real
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = (Resolve-Path 'dist/DexterFusionStudio/DexterFusionStudio.exe').Path
          $shot = Join-Path $PWD 'exe-smoke-test.png'
          $p = Start-Process -FilePath $exe -ArgumentList @('--screenshot', $shot) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "EXE failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path $shot)) { throw 'EXE did not generate GUI screenshot' }
          if ((Get-Item $shot).Length -lt 1000) { throw 'EXE screenshot is suspiciously small' }
      - name: Publicar EXE portable
        uses: actions/upload-artifact@v4
        with:
          name: DexterFusionStudio-Windows-Portable
          path: dist/DexterFusionStudio/
          retention-days: 14
