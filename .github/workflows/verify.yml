name: Verificar Dexter Fusion Studio v0.2
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Instalar dependencias de pruebas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt
      - name: Probar código y exportación
        run: |
          python -m compileall -q fusion
          python -m unittest discover -s tests -v
          # Los 4 modulos multitrack son estilo pytest (funciones + tmp_path);
          # unittest los importa pero recoge 0 tests de ellos. pytest si los corre.
          python -m pytest tests/test_audio_proxy.py tests/test_compositor.py tests/test_multitrack.py tests/test_otio_bridge.py -q
      - name: Comprobar CLI
        run: python -m fusion.cli effects
