name: DEXTER HERMES Cloud Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  pull_request:
    paths:
      - 'tools/hermes/cloud_status.py'
      - 'tests/test_hermes_cloud_status.py'
      - '.hermes/checkpoints/**'
      - '.github/workflows/hermes-cloud-monitor.yml'

permissions:
  contents: read

concurrency:
  group: hermes-cloud-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout existing project state
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cloud report tests
        run: python -m unittest discover -s tests -p test_hermes_cloud_status.py -v
      - name: Generate checkpoint status without invoking AI
        run: |
          python tools/hermes/cloud_status.py --root . --output "$RUNNER_TEMP/hermes-cloud-status.json"
      - name: Archive ephemeral report
        uses: actions/upload-artifact@v4
        with:
          name: dexter-hermes-cloud-${{ github.run_number }}
          path: ${{ runner.temp }}/hermes-cloud-status.json
          if-no-files-found: error
          retention-days: 7
