name: Verificar Dexter Fusion Studio v0.2
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Probar código y exportación
        run: |
          python -m compileall -q fusion
          python -m unittest discover -s tests -v
      - name: Comprobar CLI
        run: python -m fusion.cli effects
