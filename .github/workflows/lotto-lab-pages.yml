name: LOTTO LAB - historial oficial y sitio para iPhone
on:
  push:
    branches: [main]
    paths:
      - 'lotto-lab/**'
      - '.github/workflows/lotto-lab-pages.yml'
  schedule:
    - cron: '27 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lotto-lab-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar parsing y matematica
        run: |
          python -m unittest discover -s lotto-lab/tests -p 'test_*.py' -v
          node --check lotto-lab/assets/generator-pro.js
          node --check lotto-lab/assets/scientific-math.mjs
          node --check lotto-lab/assets/science-ui.mjs
          node --check lotto-lab/scripts/build_science.mjs
          node --check lotto-lab/assets/us-catalog.mjs
          node --input-type=module --check < lotto-lab/assets/us-catalog-ui.js
          node --test lotto-lab/tests/test_*.mjs
      - name: Descargar biblioteca completa desde NY Open Data
        run: python lotto-lab/scripts/build_data.py lotto-lab/data
      - name: Descargar sorteos NY Take 5 desde 1992 (dos sesiones por fecha)
        run: python lotto-lab/scripts/build_us_history.py lotto-lab/data
      - name: Construir informe matemático y pruebas retrospectivas reproducibles
        run: node lotto-lab/scripts/build_science.mjs lotto-lab/data
      - name: Comprobar archivos y cobertura de 48 jurisdicciones
        run: |
          test -s lotto-lab/data/powerball.json
          test -s lotto-lab/data/megamillions.json
          test -s lotto-lab/data/nytake5.json
          test -s lotto-lab/data/scientific-report.json
          test -s lotto-lab/data/us-jurisdictions.json
          python - <<'PY'
          import json
          for game in ('powerball', 'megamillions'):
              with open(f'lotto-lab/data/{game}.json',encoding='utf-8') as f:
                  obj=json.load(f)
              assert obj['count'] >= 1000
              print(game,obj['count'],obj['first_draw'],obj['last_draw'])
          take5=json.load(open('lotto-lab/data/nytake5.json',encoding='utf-8'))
          assert take5['count']>=3000 and take5['first_draw']<='1992-01-17'
          assert take5['count']==len(take5['rows'])
          directory=json.load(open('lotto-lab/data/us-jurisdictions.json',encoding='utf-8'))
          assert directory['jurisdiction_count']==len(directory['jurisdictions'])==48
          report=json.load(open('lotto-lab/data/scientific-report.json',encoding='utf-8'))
          assert set(report['games'])=={'powerball','megamillions','nytake5'}
          assert all(report['games'][name]['evidence']['evaluationDraws']>=20 for name in report['games'])
          print('nytake5',take5['count'],'jurisdictions',directory['jurisdiction_count'],'report_games',len(report['games']))
          PY
      - name: Archivo web descargable, incluso sin GitHub Pages
        uses: actions/upload-artifact@v4
        with:
          name: LOTTO-LAB-DEXTER-Historial-Completo
          path: lotto-lab/
          if-no-files-found: error
          retention-days: 30
      - name: Mantener LOTTO LAB en la ruta /lotto-lab/
        run: |
          mkdir -p _pages/lotto-lab
          cp -a lotto-lab/. _pages/lotto-lab/
          test -s _pages/lotto-lab/index.html
          test -s _pages/lotto-lab/data/powerball.json
          test -s _pages/lotto-lab/data/megamillions.json
          test -s _pages/lotto-lab/data/nytake5.json
          test -s _pages/lotto-lab/data/scientific-report.json
          test -s _pages/lotto-lab/data/us-jurisdictions.json
      - name: Preparar sitio Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar web y tres archivos oficiales, catálogo y motores
        shell: bash
        run: |
          set -euo pipefail
          base="https://h4cklaboratory.github.io/dexter-fusion-studio/lotto-lab"
          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 20 "$base/" -o /tmp/lotto.html \
              && grep -qi 'LOTTO LAB' /tmp/lotto.html \
              && grep -q 'assets/generator-pro.js' /tmp/lotto.html \
              && grep -q 'id="generador"' /tmp/lotto.html \
              && grep -q 'id="usDirectory"' /tmp/lotto.html \
              && grep -q 'id="scientificLab"' /tmp/lotto.html \
              && curl -fsSL --max-time 20 "$base/assets/generator-pro.js" -o /tmp/lotto-generator.js \
              && curl -fsSL --max-time 20 "$base/assets/lottery-pro.css" -o /tmp/lotto-style.css \
              && node --check /tmp/lotto-generator.js \
              && test -s /tmp/lotto-style.css \
              && curl -fsSL --max-time 20 "$base/assets/scientific-math.mjs" -o /tmp/scientific-math.mjs \
              && curl -fsSL --max-time 20 "$base/assets/science-ui.mjs" -o /tmp/science-ui.mjs \
              && node --check /tmp/scientific-math.mjs \
              && node --check /tmp/science-ui.mjs \
              && curl -fsSL --max-time 20 "$base/assets/us-catalog.mjs" -o /tmp/us-catalog.mjs \
              && curl -fsSL --max-time 20 "$base/assets/us-catalog-ui.js" -o /tmp/us-catalog-ui.js \
              && node --check /tmp/us-catalog.mjs \
              && node --input-type=module --check < /tmp/us-catalog-ui.js \
              && curl -fsSL --max-time 20 "$base/data/powerball.json" -o /tmp/powerball.json \
              && curl -fsSL --max-time 20 "$base/data/megamillions.json" -o /tmp/megamillions.json \
              && curl -fsSL --max-time 25 "$base/data/nytake5.json" -o /tmp/nytake5.json \
              && curl -fsSL --max-time 25 "$base/data/scientific-report.json" -o /tmp/science-report.json \
              && curl -fsSL --max-time 20 "$base/data/us-jurisdictions.json" -o /tmp/us-jurisdictions.json \
              && python -c 'import json; assert all(json.load(open(f"/tmp/{name}.json"))["count"] >= 1000 for name in ("powerball", "megamillions")); assert json.load(open("/tmp/nytake5.json"))["count"] >= 3000; assert len(json.load(open("/tmp/us-jurisdictions.json"))["jurisdictions"]) == 48; assert len(json.load(open("/tmp/science-report.json"))["games"]) == 3'; then
              echo "OK: web, 3 bibliotecas oficiales, 48 jurisdicciones y auditor científico disponibles"
              exit 0
            fi
            echo "Esperando propagación de Pages: intento $attempt/18"
            sleep 10
          done
          echo "::error::Pages no sirve HTML e históricos correctos en /lotto-lab/"
          exit 1
